[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foldcrypt"
version = "0.1.0"
description = "FoldCrypt — ShockDAQ (IEPE fold) + FoldAudio proof + WrapCancel engine"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["foldcrypt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
