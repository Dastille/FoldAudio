name: CI

# Manual-only: GitHub free-plan Actions cap (Ashlynn, 2026-10-21). Checks run locally; see artifacts/local-check-*.log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Upgrade pip + setuptools so pip-audit does not flag the runner image's
      # preinstalled copies (setuptools 79 on the 3.11 image: PYSEC-2026-3447).
      - name: Install package with dev + real (SciPy) extras
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev,real]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # pip-audit audits the installed third-party dependencies only. foldcrypt
      # itself is not published on PyPI, so --skip-editable leaves the editable
      # install out (there is no PyPI advisory record to check it against).
      - name: pip-audit (dependencies only; foldcrypt itself is not on PyPI)
        run: |
          echo "pip-audit: auditing installed dependencies only; foldcrypt is not on PyPI and is skipped (--skip-editable)."
          pip-audit --skip-editable

      - name: Pytest
        run: python -m pytest -q -rs
